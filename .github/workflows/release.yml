name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to release (defaults to the selected workflow ref)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
      published: ${{ steps.published.outputs.published }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Resolve version from Cargo.toml
        id: resolve
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::No version found in Cargo.toml"
            exit 1
          fi
          # All clients follow GitHub's latest stable release. Do not put a
          # prerelease in that feed or build a version its comparators ignore.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The update feed requires a stable major.minor.patch version"
            exit 1
          fi
          # Cargo.toml is the source of truth. A tag push must agree with it;
          # a manual run has no tag and simply releases what Cargo.toml says.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Releasing $version as v$version"

      # A published release for this version is already the finished product,
      # so rebuilding it would burn 90 minutes and could replace artifacts
      # people have downloaded. A leftover draft is this workflow's own
      # output, so it does not count and gets overwritten as before.
      - name: Look for an existing published release
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq .isDraft 2>/dev/null) || draft=missing
          if [ "$draft" = false ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is already published; skipping this run"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: macOS
    needs: version
    if: needs.version.outputs.published != 'true'
    # Cross-compile on Intel while hosted Apple-silicon runners lack capacity.
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.commit }}

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add aarch64-apple-darwin

      - uses: oven-sh/setup-bun@v2

      - name: Install create-dmg
        run: brew install create-dmg

      - uses: actions/cache/restore@v6
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-15-intel-rust-1.96.0-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            macos-15-intel-rust-1.96.0-release-

      - name: Build and verify Apple-silicon binaries
        run: |
          cargo build --locked --release --target aarch64-apple-darwin \
            --package waku --bin waku --package waku-daemon --bin waku-daemon
          mkdir -p target/release
          for executable in waku waku-daemon; do
            lipo "target/aarch64-apple-darwin/release/$executable" -verify_arch arm64
            ln -sf "../aarch64-apple-darwin/release/$executable" "target/release/$executable"
          done
        env:
          WAKU_ANALYTICS_ENDPOINT: ${{ secrets.WAKU_ANALYTICS_ENDPOINT }}
          WAKU_ANALYTICS_WEBSITE_ID: ${{ secrets.WAKU_ANALYTICS_WEBSITE_ID }}

      - name: Save release build cache before packaging
        if: ${{ always() && steps.cargo-cache.outputs.cache-hit != 'true' && steps.cargo-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Import Apple Developer Certificate
        id: certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          identity=$(security find-identity -v -p codesigning build.keychain \
            | awk '/"Developer ID Application:/ {print $2; exit}')
          if [ -z "$identity" ]; then
            echo "::error::The certificate must contain a valid Developer ID Application signing identity and private key"
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          rm certificate.p12

      - name: Store notary credentials
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            if [ -z "$ASC_KEY_ID" ]; then
              echo "::error::ASC_KEY_ID is required with ASC_PRIVATE_KEY"
              exit 1
            fi
            key_path="$RUNNER_TEMP/waku-notary-key.p8"
            umask 077
            trap 'rm -f "$key_path"' EXIT
            printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
            credentials=(--key "$key_path" --key-id "$ASC_KEY_ID")
            if [ -n "$ASC_ISSUER_ID" ]; then
              credentials+=(--issuer "$ASC_ISSUER_ID")
            fi
            xcrun notarytool store-credentials NOTARY "${credentials[@]}"
          else
            xcrun notarytool store-credentials NOTARY \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
          fi

      - name: Release
        env:
          WAKU_SIGNING_IDENTITY: ${{ secrets.WAKU_SIGNING_IDENTITY || steps.certificate.outputs.identity }}
          WAKU_ANALYTICS_ENDPOINT: ${{ secrets.WAKU_ANALYTICS_ENDPOINT }}
          WAKU_ANALYTICS_WEBSITE_ID: ${{ secrets.WAKU_ANALYTICS_WEBSITE_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          WAKU_DOWNLOAD_URL_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/
        run: bun run release --local --skip-build

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/Waku-${{ needs.version.outputs.version }}.dmg
            dist/Waku-${{ needs.version.outputs.version }}.md
            dist/Waku-${{ needs.version.outputs.version }}.zip
            dist/appcast.xml
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs: [version, macos]
    if: needs.version.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.commit }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: artifacts

      - name: Verify the signed macOS update feed and archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
          WAKU_DOWNLOAD_URL_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/
        run: bun scripts/verify-update-feeds.ts artifacts "$VERSION"

      - name: Write release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bun -e '
            import { extractReleaseNotes } from "./scripts/changelog.ts";
            const version = process.env.VERSION;
            const file = Bun.file("CHANGELOG.md");
            const notes = (await file.exists())
              ? extractReleaseNotes(await file.text(), version)
              : null;
            await Bun.write(
              "release-notes.md",
              `${notes ?? "See CHANGELOG.md for details."}\n`,
            );
          '

      - uses: softprops/action-gh-release@v3
        with:
          draft: false
          # The stable appcast URLs resolve through /releases/latest/download.
          # v3 uploads every asset before publishing and moving that pointer.
          make_latest: true
          # A manual run has no tag yet; publishing creates this one
          # at the commit that was built.
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ needs.version.outputs.commit }}
          name: ${{ needs.version.outputs.tag }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            artifacts/*.dmg
            artifacts/*.md
            artifacts/*.zip
            artifacts/appcast.xml

      # Publishing with GITHUB_TOKEN does not trigger the separate release
      # event workflow. Explicit dispatch still works with that token.
      - name: Start R2 mirror sync when configured
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ]; then
            gh workflow run sync-release.yml --repo "$GITHUB_REPOSITORY" \
              --ref "$DEFAULT_BRANCH" -f "tag=$RELEASE_TAG"
          else
            echo "R2 mirror credentials are not configured; release is available on GitHub."
          fi
